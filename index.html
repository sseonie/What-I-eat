<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>食日记</title>
<meta name="theme-color" content="#fcfaf6"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-512.png">
<style>
:root{--ink:#35332e;--muted:#85827a;--paper:#f7f6f2;--card:#fffefa;--line:#e6e4dd;--tone:#858b82;--tone-pale:#e6e9e3;--tone-deep:#505650}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(5vw,24px);background:#f7f6f2e8;backdrop-filter:blur(10px);position:sticky;top:0;z-index:3}.brand{font-weight:750;display:flex;align-items:center;gap:10px}.mark{display:grid;place-items:center;width:31px;height:31px;border-radius:10px;background:var(--tone-deep);color:white;font-size:14px}.avatar{border:0;border-radius:50%;width:31px;height:31px;background:#e2e3dc;color:#5d625c}.wrap{max-width:1080px;margin:auto;padding:62px 30px 105px}.page{display:none}.page.active{display:block;animation:in .18s ease}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1}}.content{max-width:650px}.eyebrow{font-size:11px;font-weight:750;letter-spacing:.12em;color:#73796f;margin:0 0 9px}.headline{font-size:39px;letter-spacing:-.06em;margin:0}.sub{margin:12px 0 34px;color:var(--muted);font-size:15px}.meals{display:grid;gap:12px}.meal{width:100%;border:1px solid var(--line);background:var(--card);border-radius:18px;display:flex;align-items:center;gap:15px;text-align:left;padding:15px 17px;min-height:88px}.meal:hover{border-color:#c6cbc2}.meal-icon{display:grid;place-items:center;width:51px;height:51px;border-radius:15px;background:#eff0eb;font-size:23px}.meal-copy{flex:1}.meal-copy h2{font-size:15px;margin:0 0 6px}.meal-copy p{margin:0;font-size:15px;line-height:1.5}.empty{color:#aaa9a2}.pen{color:#858b82;font-size:17px}.note{border:0;background:#edeee9;width:100%;margin-top:18px;border-radius:16px;padding:16px 17px;display:flex;align-items:center;gap:12px;text-align:left}.note div{flex:1}.note p{margin:5px 0 0;color:#6d716b;font-size:14px}.nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#fffffbe8;border:1px solid var(--line);border-radius:17px;padding:5px;display:flex;gap:3px;box-shadow:0 9px 26px #4c514415;backdrop-filter:blur(10px);z-index:4}.nav button{border:0;background:transparent;color:var(--muted);border-radius:12px;padding:10px 15px;font-size:13px}.nav button.active{background:var(--tone-pale);color:#4e554d;font-weight:700}.month-page{max-width:790px}.monthbar{display:flex;align-items:center;justify-content:space-between;margin:35px 0 18px}.monthbar button{border:0;background:transparent;color:var(--tone-deep);font-size:23px}.weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.weekdays{margin-bottom:10px}.weekdays span{text-align:center;color:#a2a29b;font-size:11px}.calendar-grid button{height:68px;border:0;background:transparent;border-radius:16px;color:#5d615a;font-size:15px;position:relative}.calendar-grid button:hover{background:#eceee9}.calendar-grid .outside{color:#d3d3cc}.calendar-grid .logged:after{content:'';width:7px;height:7px;border-radius:50%;background:var(--tone);position:absolute;bottom:9px;left:calc(50% - 3.5px)}.calendar-grid .selected{background:var(--tone-deep);color:white}.calendar-grid .selected:after{background:white}.calendar-detail{margin-top:30px;padding:21px;border-radius:18px;background:#edeee9;max-width:470px}.calendar-detail h3{margin:0;font-size:17px}.calendar-detail p:not(.eyebrow){font-size:13px;color:#6f746c;margin:8px 0 0}.week-cards{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}.day-card{min-height:190px;background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px;text-align:left}.day-card:hover{border-color:#bbc0b8}.day-card h3{margin:4px 0 14px;font-size:16px}.day-card small{color:var(--muted)}.mini{font-size:12px;line-height:1.45;margin:8px 0;color:#6f736c}.library{max-width:790px}.library-toolbar{display:flex;gap:12px;margin:29px 0 18px}.search{flex:1;border:1px solid var(--line);background:#fffefa;border-radius:12px;padding:12px 14px}.button{border:0;border-radius:11px;background:var(--tone-deep);color:#fff;padding:11px 15px;font-size:14px;font-weight:700}.categories{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}.categories button{border:1px solid var(--line);border-radius:20px;background:#fffefa;color:#6a6e68;padding:8px 12px}.categories button.active{background:var(--tone-pale);color:#424942;border-color:#d5d9d3}.food-group{margin:26px 0}.food-group h2{font-size:18px;margin:0 0 11px}.foods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.food{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;display:flex;justify-content:space-between;gap:8px;text-align:left}.food:hover{border-color:#bbc0b8}.food small{display:block;color:var(--muted);margin-top:4px}.kcal{font-size:13px;font-weight:700;color:#666c65;white-space:nowrap}.modal{display:none;position:fixed;inset:0;background:#37393355;align-items:center;justify-content:center;padding:20px;z-index:8}.modal.open{display:flex}.box{position:relative;width:min(470px,100%);max-height:92vh;overflow:auto;background:#fffefa;border-radius:24px;padding:32px;box-shadow:0 24px 70px #24262055}.close{position:absolute;right:17px;top:17px;width:31px;height:31px;border:0;border-radius:50%;background:#eeefea;font-size:20px}.box h2{margin:9px 0 22px;font-size:26px}.box label{display:block;font-size:14px;font-weight:650;margin:12px 0}.box input,.box textarea,.box select{width:100%;margin-top:6px;padding:11px;border:1px solid #dedfd8;border-radius:10px;background:white}.box textarea{height:108px;resize:vertical}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:21px}.delete{border:0;background:transparent;color:#b36758;padding:8px 0}.meal-lines{display:grid;gap:11px;margin-top:22px}.detail-meal{padding:13px 14px;background:#f3f3ef;border-radius:13px}.detail-meal strong{font-size:14px}.detail-meal p{margin:5px 0 0;font-size:14px;color:#5f635d}.category-row{display:flex;gap:8px}.category-row select{flex:1}.category-row button{margin-top:6px;border:1px solid var(--line);background:#f1f2ee;border-radius:10px;width:45px;font-size:19px}@media(max-width:760px){.week-cards{grid-template-columns:repeat(2,1fr)}.foods{grid-template-columns:1fr}}@media(max-width:430px){.wrap{padding:42px 18px 96px}.headline{font-size:33px}.nav{width:calc(100% - 24px);justify-content:space-around}.nav button{padding:9px}.nav i{display:none}.week-cards{grid-template-columns:1fr}.library-toolbar{flex-direction:column}}
</style><style>:root{--ink:#5b5654;--muted:#958985;--paper:#f8f7f4;--card:#fffefd;--line:#ded8cf;--tone:#a6929c;--tone-pale:#ecd4d2;--tone-deep:#8891a6}.top{background:#f8f7f4e8}.avatar{background:#d4cbb9;color:#716a61}.calendar-grid button{height:55px}.detail-meal{border:0;width:100%;text-align:left;cursor:pointer}.recipe-card{width:100%;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:17px;text-align:left;margin:10px 0}.recipe-card:hover{border-color:#a6929c}.recipe-card h2{font-size:17px;margin:0 0 6px}.recipe-card p{margin:0;color:var(--muted);font-size:13px}.nav{max-width:calc(100vw - 22px);overflow-x:auto;white-space:nowrap}.nav button{white-space:nowrap;writing-mode:horizontal-tb;flex:0 0 auto}.recipe-tabs{display:flex;gap:7px;margin:18px 0}.recipe-tabs button{border:0;border-radius:10px;padding:8px 11px;background:#eee9e7;color:#6d6663}.recipe-tabs button.active{background:#8891a6;color:white}.recipe-view{white-space:pre-line;line-height:1.8;color:#5f5b58}.recipe-kcal{display:inline-block;background:#e9e4dc;border-radius:14px;padding:5px 9px;font-size:13px;color:#6f665b}</style></head>
<body>
<style>.recipe-view ul,.recipe-view ol{margin:0;padding-left:23px}.recipe-view li{padding-left:4px;margin:8px 0}.recipe-view ul li::marker{color:#a6929c}.recipe-view ul ul{margin-top:6px;color:#77716d}.ingredient-group{margin:0 0 17px}.ingredient-group:last-child{margin-bottom:0}.ingredient-group h3{font-size:14px;margin:0 0 7px;color:#6d6764}#homeHeading{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC",sans-serif;font-size:40px;font-weight:700;letter-spacing:-.045em;color:#625d5c;margin-bottom:30px}</style>
<header class="top"><div class="brand"><span class="mark">食</span>食日记</div><button class="avatar" id="accountButton" type="button">登录</button></header>
<main class="wrap">
<section class="page active" id="homePage"><div class="content"><p class="eyebrow" id="homeDate"></p><h1 class="headline" id="homeHeading"></h1><div class="meals" id="mealList"></div><button class="note" onclick="openMeal('note')"><span>📝</span><div><strong>今日备注</strong><p id="notePreview"></p></div><span class="pen">✎</span></button></div></section>
<section class="page" id="weekPage"><p class="eyebrow">饮食回顾</p><h1 class="headline">本周记录</h1><p class="sub" id="weekRange"></p><div class="week-cards" id="weekCards"></div></section>
<section class="page month-page" id="monthPage"><p class="eyebrow">饮食回顾</p><h1 class="headline">月历</h1><p class="sub">有记录的日期会显示一个小圆点。</p><div class="monthbar"><button onclick="moveMonth(-1)">‹</button><strong id="monthTitle"></strong><button onclick="moveMonth(1)">›</button></div><div class="weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="calendar-grid" id="calendarGrid"></div><div class="calendar-detail"><p class="eyebrow">已选日期</p><h3 id="calendarDate"></h3><p id="calendarSummary"></p></div></section>
<section class="page library" id="libraryPage"><p class="eyebrow">我的食物备忘录</p><h1 class="headline">食物卡路里</h1><div class="library-toolbar"><input class="search" id="foodSearch" oninput="renderFoods()" placeholder="🔍 搜索食物"><button class="button" onclick="openFood()">＋ 添加食物</button></div><div class="categories" id="categoryButtons"></div><div id="foodGroups"></div></section>
<section class="page library" id="recipePage"><p class="eyebrow">我的餐桌笔记</p><h1 class="headline">食谱</h1><p class="sub">记录想再做一次的餐品、材料与步骤。</p><div class="library-toolbar"><input class="search" id="recipeSearch" oninput="renderRecipes()" placeholder="🔍 搜索食谱"><button class="button" onclick="openRecipe()">＋ 添加食谱</button></div><div id="recipeList"></div></section>
</main>
<nav class="nav"><button class="active" onclick="showPage('homePage',this)">首页</button><button onclick="showPage('weekPage',this)">周历</button><button onclick="showPage('monthPage',this)">月历</button><button onclick="showPage('libraryPage',this)">食物库</button><button onclick="showPage('recipePage',this)">食谱</button></nav>
<div class="modal" id="mealModal"><section class="box"><button class="close" onclick="closeModal('mealModal')">×</button><div id="mealEmoji" style="font-size:28px"></div><p class="eyebrow" id="mealDate"></p><h2 id="mealTitle"></h2><label id="mealLabel">吃了什么？<textarea id="mealText"></textarea></label><div class="actions"><button class="delete" id="removeMeal" onclick="removeMeal()">删除记录</button><button class="button" onclick="saveMeal()">保存记录</button></div></section></div>
<div class="modal" id="dayModal"><section class="box"><button class="close" onclick="closeModal('dayModal')">×</button><p class="eyebrow">每日饮食</p><h2 id="dayTitle"></h2><div class="meal-lines" id="dayLines"></div></section></div>
<div class="modal" id="foodModal"><section class="box"><button class="close" onclick="closeModal('foodModal')">×</button><p class="eyebrow">食物资料库</p><h2 id="foodModalTitle">添加食物</h2><label>食物名称<input id="foodName" placeholder="例如：慕斯巧克力"></label><label>分类<div class="category-row"><select id="foodCategory"></select><button type="button" onclick="openCategory()">＋</button></div></label><label>热量（kcal）<input id="foodCalories" type="number" placeholder="例如：65"></label><label>单位<input id="foodUnit" placeholder="例如：每份、每 100g、每 1/8 个"></label><label>备注（可选）<input id="foodNote" placeholder="品牌、口味或购买地点"></label><div class="actions"><button class="delete" id="removeFood" onclick="deleteFood()">删除食物</button><button class="button" onclick="saveFood()">保存食物</button></div></section></div>
<div class="modal" id="categoryModal"><section class="box"><button class="close" onclick="closeModal('categoryModal')">×</button><p class="eyebrow">食物资料库</p><h2>添加新分类</h2><label>分类名称<input id="categoryName" placeholder="例如：饮品"></label><label>图标 emoji<input id="categoryEmoji" placeholder="例如：🥤"></label><div class="actions"><span></span><button class="button" onclick="saveCategory()">添加分类</button></div></section></div>
<div class="modal" id="recipeModal"><section class="box"><button class="close" onclick="closeModal('recipeModal')">×</button><p class="eyebrow">我的食谱</p><h2 id="recipeModalTitle">添加食谱</h2><label>餐品名称<input id="recipeName" placeholder="例如：番茄鸡肉意面"></label><label>卡路里（可选）<input id="recipeCalories" type="number" placeholder="例如：540"></label><label>材料与用量<textarea id="recipeIngredients" placeholder="每行写一种材料，保存后会自动加圆点&#10;番茄 150g&#10;鸡胸肉 120g&#10;意面 80g"></textarea></label><label>制作步骤<textarea id="recipeSteps" placeholder="每行写一个步骤，保存后会自动编号&#10;煮熟意面。&#10;煎香鸡肉。&#10;加入番茄拌匀。"></textarea></label><div class="actions"><button class="delete" id="removeRecipe" onclick="deleteRecipe()">删除食谱</button><button class="button" onclick="saveRecipe()">保存食谱</button></div></section></div>
<div class="modal" id="recipeViewModal"><section class="box"><button class="close" onclick="closeModal('recipeViewModal')">×</button><p class="eyebrow">我的食谱</p><h2 id="recipeViewTitle"></h2><span class="recipe-kcal" id="recipeViewCalories"></span><div class="recipe-tabs"><button class="active" id="ingredientsTab" onclick="switchRecipeView('ingredients')">用料</button><button id="stepsTab" onclick="switchRecipeView('steps')">制作步骤</button></div><div class="recipe-view" id="recipeViewContent"></div><div class="actions"><span></span><button class="button" onclick="editViewedRecipe()">编辑</button></div></section></div>
<script>
const mealDefs=[['breakfast','🍳','Breakfast'],['lunch','🍱','Lunch'],['snacks','🍪','Snack'],['dinner','🍛','Dinner'],['drinks','🥤','Drinks']];
const starterDays={'2026-09-08':{breakfast:'贝果、鸡蛋、牛奶',lunch:'三文鱼饭、沙拉',snacks:'白色恋人、草莓巧克力',dinner:'番茄意面、鸡肉',drinks:'拿铁、水',note:'今天下午吃了甜点。'},'2026-09-09':{breakfast:'酸奶、香蕉',lunch:'鸡肉饭',snacks:'草莓巧克力'},'2026-09-07':{breakfast:'燕麦、蓝莓',lunch:'鸡肉卷',dinner:'烤鱼、米饭'},'2026-09-05':{breakfast:'吐司、牛油果',lunch:'番茄牛腩面'},'2026-09-03':{breakfast:'酸奶碗',dinner:'蔬菜咖喱饭'}};
const starterCats=[{name:'巧克力',emoji:'🍫'},{name:'饼干',emoji:'🍪'},{name:'甜点',emoji:'🍰'},{name:'调味',emoji:'🧂'},{name:'食物',emoji:'🥑'},{name:'主食',emoji:'🍜'}];
const starterFoods=[['慕斯巧克力','巧克力',65,'每份'],['草莓迪拜巧克力','巧克力',80,'每份'],['Royce 巧克力薯片','巧克力',601,'每 100g'],['白色恋人白巧','饼干',60,'每份'],['MUJI 巧克力燕麦饼干','饼干',15,'每份'],['开心果软曲奇','甜点',260,'每份'],['LeTAO 蛋糕 1/8','甜点',140,'每 1/8 个'],['桂花蜂蜜','调味',313,'每 100g'],['牛油果','食物',171,'每 100g'],['香蕉','食物',93,'每 100g'],['Kiki 辣椒拌面','主食',290,'每份']].map((x,i)=>({id:i+1,name:x[0],category:x[1],calories:x[2],unit:x[3],note:''}));
let days=JSON.parse(localStorage.getItem('monotone-diary-days')||JSON.stringify(starterDays));let categories=JSON.parse(localStorage.getItem('monotone-diary-cats')||JSON.stringify(starterCats));let foods=JSON.parse(localStorage.getItem('monotone-diary-foods')||JSON.stringify(starterFoods));let recipes=JSON.parse(localStorage.getItem('monotone-diary-recipes')||'[]');let selected='2026-09-08',year=2026,month=8,activeMeal='',activeFood=null,activeRecipe=null,filter='全部';
const el=id=>document.getElementById(id),dateKey=(y,m,d)=>y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),pretty=k=>{const[a,b,c]=k.split('-');return a+'年'+Number(b)+'月'+Number(c)+'日'},has=k=>Boolean(days[k]&&Object.values(days[k]).some(Boolean));
function persist(){localStorage.setItem('monotone-diary-days',JSON.stringify(days));localStorage.setItem('monotone-diary-cats',JSON.stringify(categories));localStorage.setItem('monotone-diary-foods',JSON.stringify(foods));localStorage.setItem('monotone-diary-recipes',JSON.stringify(recipes))}
function renderHome(){const r=days[selected]||{};el('homeDate').textContent=pretty(selected);el('homeHeading').textContent='My Food Diary';el('mealList').innerHTML=mealDefs.map(([id,icon,name])=>'<button class="meal" onclick="openMeal(\''+id+'\')"><span class="meal-icon">'+icon+'</span><span class="meal-copy"><h2>'+name+'</h2><p class="'+(!r[id]?'empty':'')+'">'+(r[id]||'Tap to add this meal')+'</p></span><span class="pen">'+(r[id]?'✎':'＋')+'</span></button>').join('');el('notePreview').textContent=r.note||'Write a little note about today…'}
function renderCalendar(){el('monthTitle').textContent=year+'年 '+(month+1)+'月';const first=new Date(year,month,1),offset=(first.getDay()+6)%7,total=new Date(year,month+1,0).getDate(),previous=new Date(year,month,0).getDate();let html='';for(let i=0;i<42;i++){let d=i-offset+1,m=month,cls='';if(d<1){d=previous+i-offset+1;m--;cls='outside'}else if(d>total){d-=total;m++;cls='outside'}const k=dateKey(year,m,d);html+='<button class="'+cls+(has(k)?' logged':'')+(k===selected?' selected':'')+'" onclick="selectDate(\''+k+'\')">'+d+'</button>'}el('calendarGrid').innerHTML=html;const r=days[selected]||{};el('calendarDate').textContent=pretty(selected);el('calendarSummary').textContent=has(selected)?'这一天记录了 '+mealDefs.filter(x=>r[x[0]]).length+' 餐。点击日期会打开详细记录。':'这一天还没有记录饮食。'}
function selectDate(k){selected=k;const bits=k.split('-');year=Number(bits[0]);month=Number(bits[1])-1;renderHome();renderCalendar();openDay(k)}
function moveMonth(n){month+=n;if(month<0){month=11;year--}if(month>11){month=0;year++}renderCalendar()}
function renderWeek(){const d=new Date(selected),start=new Date(d);start.setDate(d.getDate()-((d.getDay()+6)%7));const week=Array.from({length:7},(_,i)=>{const x=new Date(start);x.setDate(start.getDate()+i);return x});el('weekRange').textContent=(start.getMonth()+1)+'月'+start.getDate()+'日 — '+(week[6].getMonth()+1)+'月'+week[6].getDate()+'日';el('weekCards').innerHTML=week.map((d,i)=>{const k=dateKey(d.getFullYear(),d.getMonth(),d.getDate()),r=days[k]||{};return '<button class="day-card" onclick="selectDate(\''+k+'\')"><small>'+['周一','周二','周三','周四','周五','周六','周日'][i]+'</small><h3>'+d.getDate()+' 日</h3>'+mealDefs.filter(x=>r[x[0]]).map(x=>'<p class="mini">'+x[1]+' '+r[x[0]]+'</p>').join('')+(has(k)?'':'<p class="mini">— 还没有记录</p>')+'</button>'}).join('')}
function showPage(id,button){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));el(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));button.classList.add('active');if(id==='weekPage')renderWeek();if(id==='monthPage')renderCalendar();if(id==='libraryPage')renderFoods();if(id==='recipePage')renderRecipes()}
function closeModal(id){el(id).classList.remove('open')}function openMeal(id){activeMeal=id;const r=days[selected]||{},m=mealDefs.find(x=>x[0]===id);el('mealEmoji').textContent=id==='note'?'📝':m[1];el('mealDate').textContent=pretty(selected);el('mealTitle').textContent=id==='note'?'Note':m[2];el('mealLabel').firstChild.textContent='';el('mealText').value=r[id]||'';el('removeMeal').style.visibility=r[id]?'visible':'hidden';el('mealModal').classList.add('open')}
function saveMeal(){days[selected]??={};const value=el('mealText').value.trim();if(value)days[selected][activeMeal]=value;else delete days[selected][activeMeal];if(!Object.values(days[selected]).some(Boolean))delete days[selected];persist();closeModal('mealModal');renderHome();renderCalendar();renderWeek()}function removeMeal(){el('mealText').value='';saveMeal()}
function openDay(k){const r=days[k]||{};el('dayTitle').textContent=pretty(k);const rows=mealDefs.filter(m=>r[m[0]]).map(m=>'<button class="detail-meal" onclick="closeModal(\'dayModal\');openMeal(\''+m[0]+'\')"><strong>'+m[1]+' '+m[2]+'　✎</strong><p>'+r[m[0]]+'</p></button>').join('')+(r.note?'<button class="detail-meal" onclick="closeModal(\'dayModal\');openMeal(\'note\')"><strong>📝 备注　✎</strong><p>'+r.note+'</p></button>':'')||'<p class="sub">这一天还没有记录饮食。</p>';el('dayLines').innerHTML=rows;el('dayModal').classList.add('open')}
function renderFoods(){const q=el('foodSearch').value.trim().toLowerCase();el('categoryButtons').innerHTML=[{name:'全部',emoji:'⌘'},...categories].map(c=>'<button class="'+(filter===c.name?'active':'')+'" onclick="filter=\''+c.name.replace(/'/g,'')+'\';renderFoods()">'+c.emoji+' '+c.name+'</button>').join('');const list=foods.filter(f=>(filter==='全部'||f.category===filter)&&(f.name+f.category+f.note).toLowerCase().includes(q));el('foodGroups').innerHTML=categories.map(c=>{const group=list.filter(f=>f.category===c.name);return group.length?'<section class="food-group"><h2>'+c.emoji+' '+c.name+'</h2><div class="foods">'+group.map(f=>'<button class="food" onclick="openFood('+f.id+')"><span><strong>'+f.name+'</strong><small>'+(f.note||f.unit)+'</small></span><span class="kcal">'+f.calories+' kcal<small>'+f.unit+'</small></span></button>').join('')+'</div></section>':''}).join('')||'<p class="sub">没有找到符合的食物。</p>'}
function fillCategorySelect(current=''){el('foodCategory').innerHTML=categories.map(c=>'<option '+(c.name===current?'selected':'')+' value="'+c.name+'">'+c.emoji+' '+c.name+'</option>').join('')}
function openFood(id){activeFood=id?foods.find(f=>f.id===id):null;el('foodModalTitle').textContent=activeFood?'编辑食物':'添加食物';el('foodName').value=activeFood?.name||'';fillCategorySelect(activeFood?.category||categories[0]?.name||'');el('foodCalories').value=activeFood?.calories||'';el('foodUnit').value=activeFood?.unit||'';el('foodNote').value=activeFood?.note||'';el('removeFood').style.visibility=activeFood?'visible':'hidden';el('foodModal').classList.add('open')}
function saveFood(){const name=el('foodName').value.trim(),calories=el('foodCalories').value.trim(),unit=el('foodUnit').value.trim();if(!name||!calories||!unit)return;const item={id:activeFood?.id||Date.now(),name,category:el('foodCategory').value,calories:Number(calories),unit,note:el('foodNote').value.trim()};if(activeFood)foods=foods.map(f=>f.id===item.id?item:f);else foods.push(item);persist();closeModal('foodModal');renderFoods()}function deleteFood(){foods=foods.filter(f=>f.id!==activeFood.id);persist();closeModal('foodModal');renderFoods()}
function openCategory(){closeModal('foodModal');el('categoryName').value='';el('categoryEmoji').value='';el('categoryModal').classList.add('open')}function saveCategory(){const name=el('categoryName').value.trim(),emoji=el('categoryEmoji').value.trim()||'🍽️';if(!name||categories.some(c=>c.name===name))return;categories.push({name,emoji});persist();closeModal('categoryModal');openFood();el('foodCategory').value=name;renderFoods()}
function renderRecipes(){const q=el('recipeSearch').value.trim().toLowerCase();const list=recipes.filter(r=>(r.name+r.ingredients+r.steps).toLowerCase().includes(q));el('recipeList').innerHTML=list.map(r=>'<button class="recipe-card" onclick="openRecipe('+r.id+')"><h2>'+r.name+'</h2><p>'+(r.calories?r.calories+' kcal　':'')+(r.ingredients.split('\n').filter(Boolean).length)+' 项材料　'+(r.steps.split('\n').filter(Boolean).length)+' 个步骤</p></button>').join('')||'<p class="sub">还没有食谱。添加第一道想再做一次的餐品吧。</p>'}
function openRecipe(id){activeRecipe=id?recipes.find(r=>r.id===id):null;if(activeRecipe){el('recipeViewTitle').textContent=activeRecipe.name;el('recipeViewCalories').textContent=activeRecipe.calories?activeRecipe.calories+' kcal':'未填写卡路里';switchRecipeView('ingredients');el('recipeViewModal').classList.add('open');return}openRecipeEditor()}
function openRecipeEditor(){el('recipeModalTitle').textContent=activeRecipe?'编辑食谱':'添加食谱';el('recipeName').value=activeRecipe?.name||'';el('recipeCalories').value=activeRecipe?.calories||'';el('recipeIngredients').value=activeRecipe?.ingredients||'';el('recipeSteps').value=activeRecipe?.steps||'';el('removeRecipe').style.visibility=activeRecipe?'visible':'hidden';el('recipeModal').classList.add('open')}
function cleanRecipeLine(line){return line.trim().replace(/^[-•*]\s*/,'').replace(/^\d+[.)、]\s*/,'')}
function safeText(text){return text.replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function makeRecipeList(text,type){const lines=text.split('\n').filter(x=>x.trim());if(type==='ol'){return '<ol>'+lines.map(item=>'<li>'+safeText(cleanRecipeLine(item))+'</li>').join('')+'</ol>'}let groups=[],current={title:'',items:[]};lines.forEach(raw=>{const trimmed=raw.trim();if(/[:：]$/.test(trimmed)&&!/^[-•*\s]/.test(raw)){if(current.title||current.items.length)groups.push(current);current={title:trimmed.slice(0,-1),items:[]}}else{const isChild=/^\s|^[-•*]/.test(raw),item={text:cleanRecipeLine(trimmed),children:[]};if(isChild&&current.items.length)current.items[current.items.length-1].children.push(item.text);else current.items.push(item)}});if(current.title||current.items.length)groups.push(current);return groups.map(group=>'<section class="ingredient-group">'+(group.title?'<h3>'+safeText(group.title)+'</h3>':'')+'<ul>'+group.items.map(item=>'<li>'+safeText(item.text)+(item.children.length?'<ul>'+item.children.map(child=>'<li>'+safeText(child)+'</li>').join('')+'</ul>':'')+'</li>').join('')+'</ul></section>').join('')}
function switchRecipeView(tab){const isIngredients=tab==='ingredients';el('ingredientsTab').classList.toggle('active',isIngredients);el('stepsTab').classList.toggle('active',!isIngredients);el('recipeViewContent').innerHTML=makeRecipeList(isIngredients?activeRecipe.ingredients:activeRecipe.steps,isIngredients?'ul':'ol')}
function editViewedRecipe(){closeModal('recipeViewModal');openRecipeEditor()}
function saveRecipe(){const name=el('recipeName').value.trim(),ingredients=el('recipeIngredients').value.trim(),steps=el('recipeSteps').value.trim();if(!name||!ingredients||!steps)return;const item={id:activeRecipe?.id||Date.now(),name,calories:el('recipeCalories').value.trim(),ingredients,steps};if(activeRecipe)recipes=recipes.map(r=>r.id===item.id?item:r);else recipes.push(item);persist();closeModal('recipeModal');renderRecipes()}function deleteRecipe(){recipes=recipes.filter(r=>r.id!==activeRecipe.id);persist();closeModal('recipeModal');renderRecipes()}
if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js')}renderHome();renderCalendar();renderWeek();renderFoods();renderRecipes();
</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="auth-sync.js"></script></body></html>
